  - name: resenas
    label: Reseñas de terapia
    label_singular: Reseña
    description: Aparecen como pósits en la página de inicio. Se ordenan por el número de «Orden».
    folder: src/content/resenas
    extension: json
    format: json
    create: true
    delete: true
    editor:
      preview: false
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{orden}}. {{nombre}}"
    sortable_fields:
      - orden
      - nombre
    fields:
      - label: Nombre (o «Anónima»)
        name: nombre
        widget: string
      - label: Reseña
        name: texto
        widget: markdown
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - link
          - bulleted-list
          - numbered-list
        editor_components: []
      - label: Orden
        name: orden
        widget: number
        value_type: int
        default: 99
      - label: Publicada
        name: publicada
        widget: boolean
        default: true
        hint: Desactívalo para ocultarla sin borrarla.
  - name: recursos
