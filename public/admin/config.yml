# Configuración del panel de edición (Decap CMS).
# Antes de publicar, cambia `repo` por el repositorio real de GitHub (usuario/nombre).
# Modo borradores: cada cambio se guarda como borrador con su propia vista previa; «Publicar» lo pone en la web.
# Para probar el panel en tu ordenador: `npm run cms` y `npm run dev`, y abre http://localhost:4321/admin
backend:
  name: github
  repo: ItsasoAguirre/psicologia-sin-estigma
  branch: main
  commit_messages:
    create: "chore(contenido): crear {{collection}} «{{slug}}»"
    update: "chore(contenido): actualizar {{collection}} «{{slug}}»"
    delete: "chore(contenido): borrar {{collection}} «{{slug}}»"
    uploadMedia: "chore(contenido): subir imagen «{{path}}»"
    deleteMedia: "chore(contenido): borrar imagen «{{path}}»"
    openAuthoring: "{{message}}"
local_backend: true
locale: es
site_url: https://psicologiasinestigma.netlify.app
display_url: https://psicologiasinestigma.netlify.app
logo_url: /uploads/logo.png
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: paginas
    label: Páginas
    label_singular: Página
    description: Los textos e imágenes de cada página de la web.
    editor:
      preview: false
    format: json
    files:
      - name: inicio
        label: Inicio
        file: src/content/paginas/inicio.json
        fields:
          - label: Cabecera
            name: hero
            widget: object
            fields:
              - label: Título grande
                name: titulo
                widget: string
              - label: Texto
                name: texto
                widget: text
              - label: Imagen
                name: imagen
                widget: image
              - label: Texto del botón (lleva a Psicoterapia)
                name: boton
                widget: string
          - label: Valores (fila de iconos)
            name: valores
            widget: list
            summary: "{{fields.texto}}"
            fields:
              - label: Icono
                name: icono
                widget: select
                options:
                  - label: Libro
                    value: libro
                  - label: Megáfono
                    value: megafono
                  - label: Manos con corazón
                    value: manos
                  - label: Persona
                    value: persona
                  - label: Portátil
                    value: portatil
                  - label: Sillón
                    value: silla
                  - label: Sobre (email)
                    value: email
                  - label: Bolígrafo
                    value: boli
                  - label: Tick
                    value: check
                  - label: Corazón
                    value: corazon
                  - label: Teléfono
                    value: telefono
                  - label: Hoja
                    value: hoja
                  - label: Estrella
                    value: estrella
                  - label: Reloj
                    value: reloj
              - label: Texto
                name: texto
                widget: string
          - label: Newsletter
            name: newsletter
            widget: object
            hint: El formulario se conecta con Brevo en «Ajustes generales → Formulario de la newsletter».
            fields:
              - label: Título
                name: titulo
                widget: string
              - label: Texto
                name: texto
                widget: text
              - label: Imagen
                name: imagen
                widget: image
              - label: Texto del botón
                name: boton
